name: Update water quality dashboard

on:
  schedule:
    # GitHub Actions cron always runs in UTC and can't express "Finland local
    # time" directly, so we schedule both possible UTC offsets for 09:30
    # Europe/Helsinki (EEST = UTC+3 in summer, EET = UTC+2 in winter). Both
    # entries fire every day; the `gate` job below skips whichever one is
    # redundant. GitHub's scheduler can also delay runs by minutes to hours
    # during peak load, so the two entries double as a retry: if the first
    # one is delayed past its window, the second still triggers a run since
    # gating is based on whether today's update has landed yet, not on the
    # wall-clock hour.
    #
    # Re-saved 2026-07-23 to nudge GitHub into re-registering the schedule
    # after it stopped firing following the previous edit.
    - cron: "24 4 * * *"  # 09:30 EEST (summer, UTC+3)
    - cron: "47 7 * * *"  # 09:30 EET  (winter, UTC+2)
  workflow_dispatch:
    inputs:
      force_refit:
        description: "Force model refit and re-render even if no new data was fetched"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write

# Only one Pages deployment at a time; let in-flight runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gate:
    # Only relevant for the schedule trigger: with two cron entries covering
    # both DST offsets, only one is "supposed" to matter each day, but
    # GitHub's scheduler can delay a run by hours, so we can't gate on
    # wall-clock time (that's what caused runs to be skipped even when
    # nothing had actually run yet). Instead, gate on whether today's
    # automated update has already landed: skip only if it has. This makes
    # the second cron entry act as a retry for a delayed/missed first one.
    # Manual dispatches and pushes always proceed.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'schedule' }}
        with:
          fetch-depth: 20

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            today=$(date -u +%Y-%m-%d)
            if git log --format=%s -n 20 | grep -qF "Automated data update $today"; then
              echo "Skipping: today's automated update ($today) has already run."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies (pdftotext for bacteria PDF parsing)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch new data (rain, flow, and bacteria all auto-applied)
        run: Rscript R/00_fetch_data.R

      - name: Force model refit (manual override)
        if: ${{ github.event.inputs.force_refit == 'true' }}
        run: rm -f output/model_entero.rds output/model_coli.rds

      - name: Run model + prediction pipeline
        run: Rscript main.R

      - name: Render dashboard
        run: quarto render dashboard.qmd

      - name: Commit updated data & model outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git diff --staged --quiet || git commit -m "Automated data update $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp -r dashboard_files _site/dashboard_files

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
